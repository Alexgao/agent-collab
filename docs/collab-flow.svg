  <text x="250" y="720" text-anchor="middle" class="h">1. 小任务人工盯一遍</text>
  <text x="250" y="748" text-anchor="middle" class="s">约一小时可完成的功能</text>
  <rect x="520" y="680" width="300" height="100" class="box" fill="#fff" stroke="#d97706"/>
  <text x="670" y="720" text-anchor="middle" class="h">2. 保存为 Grok Bot skill</text>
  <text x="670" y="748" text-anchor="middle" class="s">固化步骤，减少口头转述</text>
  <rect x="940" y="680" width="340" height="100" class="box" fill="#fff" stroke="#d97706"/>
  <text x="1110" y="720" text-anchor="middle" class="h">3. 稳定后自动触发</text>
  <text x="1110" y="748" text-anchor="middle" class="s">routine / 事件驱动</text>
  <line x1="400" y1="730" x2="515" y2="730" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="730" x2="935" y2="730" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="875" text-anchor="middle" class="s" fill="#6b7280">数据不靠聊天互相转述；以仓库任务卡与 PR 为唯一交接台</text>
</svg>
