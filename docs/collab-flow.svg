  <rect x="690" y="460" width="180" height="60" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="780" y="495" text-anchor="middle" class="t">分支 / PR 差异</text>
  <rect x="920" y="460" width="180" height="60" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="1010" y="495" text-anchor="middle" class="t">审查意见</text>
  <rect x="40" y="600" width="1320" height="240" class="box" fill="#fffbeb" stroke="#d97706"/>
  <text x="700" y="640" text-anchor="middle" class="h">从试跑小任务到完整闭环</text>
